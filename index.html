<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Forge</title>
  <meta name="description" content="A free, open-source, config-driven portfolio for developers. Fork it, edit config.json, deploy to GitHub Pages.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚒️</text></svg>">
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="nav-brand" href="#top">⚒️ <span>Portfolio Forge</span></a>
      <button id="theme-toggle" class="theme-btn" aria-label="Toggle theme" title="Toggle dark/light">
        <svg id="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
        <svg id="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <main id="top">

    <section id="hero" class="hero">
      <div class="container hero-grid">
        <div class="hero-left">
          <p id="hero-tagline" class="tagline"></p>
          <h1 id="hero-name" class="hero-title"></h1>
          <p id="hero-bio" class="hero-bio"></p>
          <div id="hero-cta" class="hero-cta"></div>
          <div id="hero-socials" class="socials"></div>
        </div>
        <div class="hero-right">
          <div class="avatar-frame">
            <img id="hero-avatar" class="avatar" alt="avatar">
          </div>
        </div>
      </div>
    </section>

    <section id="about" class="section hidden">
      <div class="container">
        <h2 class="section-title">About</h2>
        <div id="about-body"></div>
        <div id="about-highlights" class="highlights"></div>
      </div>
    </section>

    <section id="projects" class="section hidden">
      <div class="container">
        <h2 class="section-title">Projects</h2>
        <div id="project-grid" class="card-grid"></div>
      </div>
    </section>

    <section id="skills" class="section hidden">
      <div class="container">
        <h2 class="section-title">Skills</h2>
        <div id="skill-groups" class="skill-groups"></div>
      </div>
    </section>

    <section id="github" class="section hidden">
      <div class="container">
        <h2 class="section-title">GitHub</h2>
        <div id="github-cards" class="github-stats"></div>
      </div>
    </section>

    <section id="experience" class="section hidden">
      <div class="container">
        <h2 class="section-title">Experience</h2>
        <div id="timeline" class="timeline"></div>
      </div>
    </section>

    <section id="contact" class="section hidden">
      <div class="container">
        <h2 class="section-title">Contact</h2>
        <p id="contact-text" class="contact-text"></p>
        <div id="contact-links" class="socials"></div>
      </div>
    </section>

  </main>

  <footer class="footer">
    <div class="container">
      <p>Built with ⚒️ <strong>Portfolio Forge</strong></p>
      <p id="footer-note" class="footer-note"></p>
    </div>
  </footer>

  <script src="assets/script.js"></script>
</body>
</html>
